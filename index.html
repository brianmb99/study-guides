<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f0e1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Study Guides">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Study Guides</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%239c3418' width='16' height='16' rx='2'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 18px; }
    body {
      margin: 0;
      color: #1c140c;
      background: #e4d3b4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.45;
    }
    main {
      max-width: 640px;
      min-height: 100vh;
      margin: 0 auto;
      padding: calc(24px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
      background: #f7f0e1;
    }
    h1 {
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
      font-size: 1.7rem;
      margin: 0 0 4px;
    }
    .lede { margin: 0 0 20px; color: #5b4a36; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    a.guide {
      display: block;
      padding: 16px;
      border: 1px solid #e0d0b4;
      border-left: 5px solid #9c3418;
      border-radius: 14px;
      background: #fffaf2;
      color: inherit;
      text-decoration: none;
    }
    a.guide:active { background: #f6ead3; }
    a.guide:focus-visible { outline: 3px solid #c8962e; outline-offset: 2px; }
    .title {
      display: block;
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
      font-size: 1.25rem;
      font-weight: bold;
    }
    .meta { display: block; margin-top: 2px; font-size: 0.85rem; color: #7a3a1c; font-weight: 600; }
    .blurb { display: block; margin-top: 6px; font-size: 0.95rem; color: #3d2f20; }
    .badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 8px;
      border-radius: 999px;
      background: #c8962e;
      color: #1c140c;
      font: 700 0.7rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      vertical-align: middle;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    @media (min-width: 900px) {
      body {
        background:
          radial-gradient(900px 420px at 50% 0%, #f4e7cf 0%, #e4d3b4 52%, #d8c29a 100%);
      }
      main {
        max-width: 1040px;
        min-height: 100vh;
        padding: 64px 48px 80px;
        background: #f7f0e1;
        box-shadow:
          0 0 0 1px rgba(156, 52, 24, 0.12),
          0 18px 50px rgba(60, 30, 10, 0.12);
      }
      h1 {
        font-size: 3rem;
        letter-spacing: -0.02em;
        margin-bottom: 8px;
      }
      h1::after {
        content: "";
        display: block;
        width: 72px;
        height: 4px;
        margin-top: 14px;
        background: #9c3418;
        border-radius: 2px;
      }
      .lede {
        max-width: 36rem;
        font-size: 1.15rem;
        margin-bottom: 28px;
      }
      ul {
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
        gap: 16px;
      }
      a.guide {
        height: 100%;
        padding: 20px 20px 18px;
      }
    }
    @media (min-width: 900px) and (hover: hover) and (pointer: fine) {
      a.guide:hover {
        background: #fff;
        border-color: #c9a36a;
        box-shadow: 0 10px 24px rgba(60, 30, 10, 0.08);
      }
    }
    .offline-status {
      margin: 16px 0 8px;
      color: #5b4a36;
      font-size: 0.85rem;
    }
    .offline-refresh {
      border: 2px solid #9c3418;
      color: #6e2412;
      background: #fffaf2;
      border-radius: 999px;
      padding: 6px 14px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }
    .offline-refresh:disabled {
      opacity: 0.55;
      cursor: default;
    }
    .note {
      margin: 14px 0 0;
      color: #5b4a36;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Study Guides</h1>
      <p class="lede">Flashcards, quizzes, and maps that teach as you go. Newest first.</p>
    </header>
    <ul id="guides"></ul>
    <noscript>
      <ul>
        <li><a class="guide" href="animal-classification/"><span class="title">Animal Classification</span></a></li>
        <li><a class="guide" href="renaissance/"><span class="title">The Renaissance</span></a></li>
      </ul>
    </noscript>
    <div id="offline"></div>
    <p class="note">Add it to your home screen: Share, then Add to Home Screen (iPhone), or the browser menu, then Install app (Android/Chrome).</p>
  </main>
  <script>
    // Add new guides here; the list always sorts newest first by `added`.
    const GUIDES = [
      {
        path: "animal-classification/",
        title: "Animal Classification",
        meta: "Science · First science assessment · Miss Verheeck",
        blurb: "All 10 review sheet questions with full, correct answers, plus a Venn diagram, flashcards, a sorting game, a quiz, and a cram sheet.",
        added: "2026-10-31",
      },
      {
        path: "renaissance/",
        title: "The Renaissance",
        meta: "History · Chapters 7–8 · Test Tue, Oct 27, 2026",
        blurb: "Crash course, flashcards, worksheet fill-ins, art ID, map of Italy, quiz, and essay prep.",
        added: "2026-10-22",
      },
    ];

    const list = document.getElementById("guides");
    GUIDES.slice()
      .sort((a, b) => b.added.localeCompare(a.added))
      .forEach((guide, i) => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.className = "guide";
        a.href = guide.path;
        const title = document.createElement("span");
        title.className = "title";
        title.textContent = guide.title;
        if (i === 0) {
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = "Newest";
          title.appendChild(badge);
        }
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = guide.meta;
        const blurb = document.createElement("span");
        blurb.className = "blurb";
        blurb.textContent = guide.blurb;
        a.append(title, meta, blurb);
        li.appendChild(a);
        list.appendChild(li);
      });
  </script>
  <script src="offline.js"></script>
  <script>
    var offlineBox = document.getElementById("offline");
    if (window.StudyOffline) window.StudyOffline.mount(offlineBox);
  </script>
</body>
</html>
